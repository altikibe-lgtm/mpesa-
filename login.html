<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>M-PESA App Clone</title>
  <style>
    /* ============================================
       CSS VARIABLES & RESET
       ============================================ */
    :root {
      --primary-green: #35A853;
      --bright-green: #00D95F;
      --red-accent: #E31B3B;
      --blue-accent: #18A9E5;
      --page-bg: #F3F5F8;
      --card-bg: #FFFFFF;
      --text-primary: #252525;
      --text-secondary: #777777;
      --skeleton-base: #E8EAED;
      --skeleton-shine: #F5F6F8;
      --hidden-base: #E2E6EA;
      --hidden-shine: #F0F2F5;
      --shadow-sm: 0 1px 4px rgba(0, 0, 0, 0.04);
      --shadow-md: 0 2px 8px rgba(0, 0, 0, 0.06);
      --shadow-lg: 0 4px 16px rgba(0, 0, 0, 0.08);
      --radius-card: 28px;
      --radius-btn: 12px;
      --font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      overflow-x: hidden;
      background-color: var(--page-bg);
      font-family: var(--font-family);
      color: var(--text-primary);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* ============================================
       APP CONTAINER
       ============================================ */
    .app-container {
      max-width: 100%;
      margin: 0 auto;
      background-color: var(--page-bg);
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
      padding-bottom: 24px;
    }

    @media (min-width: 480px) {
      .app-container {
        max-width: 430px;
        box-shadow: 0 0 40px rgba(0, 0, 0, 0.06);
      }
    }

    /* ============================================
       A. TOP HEADER
       ============================================ */
    .header {
      background: var(--card-bg);
      padding: 16px 18px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(0, 0, 0, 0.05);
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 14px;
      flex: 1;
      min-width: 0;
    }

    .avatar-wrapper {
      position: relative;
      flex-shrink: 0;
    }

    .avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: #E8F0FE;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 17px;
      color: #1A73E8;
      letter-spacing: -0.3px;
      border: 2px solid #FFFFFF;
      box-shadow: 0 0 0 1px rgba(0,0,0,0.05);
    }

    .avatar-badge {
      position: absolute;
      bottom: -2px;
      right: -2px;
      width: 18px;
      height: 18px;
      background: var(--primary-green);
      border-radius: 50%;
      border: 2px solid #FFFFFF;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .avatar-badge svg {
      width: 9px;
      height: 9px;
      fill: #FFFFFF;
    }

    .greeting {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .greeting-top {
      font-size: 13px;
      color: var(--text-secondary);
      font-weight: 400;
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .greeting-name {
      font-size: 19px;
      font-weight: 700;
      color: var(--text-primary);
      line-height: 1.3;
      display: flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }

    .icon-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--card-bg);
      border: 1px solid rgba(0, 0, 0, 0.06);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      cursor: pointer;
      transition: background 0.2s;
      box-shadow: var(--shadow-sm);
    }

    .icon-btn:active {
      background: #F5F6F8;
    }

    .icon-btn svg {
      width: 22px;
      height: 22px;
    }

    .notification-dot {
      position: absolute;
      top: 9px;
      right: 9px;
      width: 9px;
      height: 9px;
      background: var(--red-accent);
      border-radius: 50%;
      border: 1.5px solid #FFFFFF;
    }

    /* ============================================
       B. BALANCE CARD CAROUSEL
       ============================================ */
    .carousel-section {
      padding: 16px 0 0 16px;
      overflow: hidden;
      position: relative;
    }

    .carousel-track {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      -ms-overflow-style: none;
      padding-right: 16px;
      padding-bottom: 6px;
    }

    .carousel-track::-webkit-scrollbar {
      display: none;
    }

    .balance-card {
      flex: 0 0 74%; /* Approximately 520px on a 720px viewport */
      max-width: 350px;
      background: var(--card-bg);
      border-radius: var(--radius-card);
      padding: 18px 20px 20px;
      scroll-snap-align: start;
      position: relative;
      overflow: hidden;
      box-shadow: var(--shadow-sm);
      border: 1px solid rgba(0, 0, 0, 0.04);
      min-height: 200px; /* Approximately 309px on reference viewport */
      display: flex;
      flex-direction: column;
    }

    /* Geometric pattern background */
    .balance-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-image: url("data:image/svg+xml,%3Csvg width='240' height='240' viewBox='0 0 240 240' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M120 0 L180 40 L220 20 L240 80 L200 120 L240 180 L180 200 L140 240 L80 200 L40 240 L0 180 L40 120 L0 60 Z' fill='none' stroke='%23edf2f0' stroke-width='0.5'/%3E%3Cpath d='M60 0 L120 60 L80 100 L140 140 L100 180 L160 200 L120 240 L60 200 L20 240 L0 160 L40 100 Z' fill='none' stroke='%23edf2f0' stroke-width='0.5'/%3E%3Cpath d='M180 0 L220 60 L180 100 L240 140 L200 180 L240 220 L180 240 L140 200 L100 240 L60 180 Z' fill='none' stroke='%23edf2f0' stroke-width='0.5'/%3E%3C/svg%3E");
      background-size: 200px 200px;
      background-position: 100px 20px;
      background-repeat: no-repeat;
      pointer-events: none;
      z-index: 0;
      opacity: 0.9;
    }

    /* Left accent border - green top, blue bottom, curved to follow card shape */
    .balance-card::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      bottom: 0;
      width: 4px;
      border-radius: var(--radius-card) 0 0 var(--radius-card);
      background: linear-gradient(180deg, var(--primary-green) 0%, var(--primary-green) 40%, var(--blue-accent) 60%, var(--blue-accent) 100%);
      z-index: 1;
      pointer-events: none;
    }

    .balance-card > * {
      position: relative;
      z-index: 2;
    }

    .balance-label {
      font-size: 14px;
      font-weight: 600;
      color: var(--primary-green);
      margin-bottom: 6px;
      letter-spacing: 0.2px;
    }

    .balance-amount-row {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 10px;
      margin-bottom: 4px;
      min-height: 34px;
    }

    .balance-amount {
      font-size: 36px;
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: -0.5px;
      line-height: 1.2;
    }

    .balance-amount.hidden {
      display: none;
    }

    /* Hidden balance placeholder (soft gray rounded bars) */
    .balance-hidden-placeholder {
      display: none;
      width: 120px;
      height: 34px;
      border-radius: 8px;
      background: linear-gradient(90deg, var(--hidden-base) 25%, var(--hidden-shine) 50%, var(--hidden-base) 75%);
      background-size: 200% 100%;
      animation: shimmer-hidden 2s infinite;
    }

    .balance-hidden-placeholder.visible {
      display: block;
    }

    .fuliza-hidden-placeholder {
      display: none;
      width: 180px;
      height: 18px;
      border-radius: 6px;
      background: linear-gradient(90deg, var(--hidden-base) 25%, var(--hidden-shine) 50%, var(--hidden-base) 75%);
      background-size: 200% 100%;
      animation: shimmer-hidden 2s infinite;
      margin-bottom: 14px;
    }

    .fuliza-hidden-placeholder.visible {
      display: block;
    }

    @keyframes shimmer-hidden {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    .eye-btn {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: none;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--text-secondary);
      transition: background 0.2s;
      flex-shrink: 0;
    }

    .eye-btn:active {
      background: rgba(0,0,0,0.05);
    }

    .eye-btn svg {
      width: 22px;
      height: 22px;
    }

    .fuliza-text {
      font-size: 13px;
      color: var(--text-secondary);
      font-weight: 400;
      margin-bottom: 14px;
      min-height: 18px;
    }

    .view-statements-btn {
      display: block;
      width: 100%;
      padding: 14px 0;
      background: transparent;
      border: 2px solid var(--primary-green);
      border-radius: 16px;
      color: var(--primary-green);
      font-size: 15px;
      font-weight: 600;
      font-family: var(--font-family);
      cursor: pointer;
      transition: background 0.2s;
      text-align: center;
      margin-top: auto;
    }

    .view-statements-btn:active {
      background: rgba(53, 168, 83, 0.06);
    }

    /* Skeleton loading state */
    .skeleton {
      background: linear-gradient(90deg, var(--skeleton-base) 25%, var(--skeleton-shine) 50%, var(--skeleton-base) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
      border-radius: 6px;
    }

    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    .skeleton-amount {
      width: 100px;
      height: 30px;
      border-radius: 8px;
    }

    .skeleton-fuliza {
      width: 160px;
      height: 16px;
      border-radius: 6px;
    }

    .skeleton-hidden {
      display: none !important;
    }

    /* Second card */
    .balance-card.secondary {
      flex: 0 0 60%;
      max-width: 260px;
    }

    .balance-card.secondary .balance-label {
      color: var(--primary-green);
    }

    /* ============================================
       C. CAROUSEL INDICATORS
       ============================================ */
    .carousel-indicators {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
      padding: 12px 0 4px;
    }

    .indicator {
      height: 6px;
      border-radius: 3px;
      background: #D1D5DB;
      transition: all 0.3s ease;
    }

    .indicator.active {
      width: 24px;
      background: var(--primary-green);
    }

    .indicator.inactive {
      width: 6px;
      background: #D1D5DB;
    }

    /* ============================================
       D. QUICK ACTIONS CARD
       ============================================ */
    .quick-actions-card {
      margin: 14px 16px 0;
      background: var(--card-bg);
      border-radius: var(--radius-card);
      padding: 18px 14px 18px;
      box-shadow: var(--shadow-sm);
    }

    .quick-actions-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .quick-actions-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-primary);
    }

    .view-all {
      font-size: 13px;
      font-weight: 600;
      color: var(--primary-green);
      display: flex;
      align-items: center;
      gap: 2px;
      cursor: pointer;
      text-decoration: none;
    }

    .view-all svg {
      width: 16px;
      height: 16px;
      fill: var(--primary-green);
    }

    .quick-actions-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      row-gap: 18px;
      column-gap: 4px;
    }

    .quick-action-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      border: none;
      background: transparent;
      padding: 0;
      font-family: var(--font-family);
      -webkit-tap-highlight-color: transparent;
    }

    .quick-action-item:active .qa-icon {
      transform: scale(0.95);
    }

    .qa-icon {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: #F5F6F8;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s ease;
      flex-shrink: 0;
    }

    .qa-icon svg {
      width: 24px;
      height: 24px;
    }

    .qa-label {
      font-size: 10px;
      font-weight: 500;
      color: var(--text-primary);
      text-align: center;
      line-height: 1.3;
      max-width: 68px;
      word-wrap: break-word;
      overflow-wrap: break-word;
    }

    /* ============================================
       E. FREQUENTS CARD
       ============================================ */
    .frequents-card {
      margin: 14px 16px 0;
      background: var(--card-bg);
      border-radius: var(--radius-card);
      padding: 16px 18px;
      box-shadow: var(--shadow-sm);
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      transition: background 0.2s;
    }

    .frequents-card:active {
      background: #FAFBFC;
    }

    .frequents-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .frequents-chevron {
      width: 20px;
      height: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.3s ease;
      color: var(--text-secondary);
    }

    .frequents-chevron.open {
      transform: rotate(180deg);
    }

    .frequents-chevron svg {
      width: 16px;
      height: 16px;
    }

    .frequents-content {
      margin: 0 16px;
      background: var(--card-bg);
      border-radius: 0 0 var(--radius-card) var(--radius-card);
      padding: 0 18px;
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.3s ease, padding 0.3s ease;
      box-shadow: var(--shadow-sm);
      margin-top: -4px;
    }

    .frequents-content.open {
      max-height: 200px;
      padding: 8px 18px 16px;
    }

    .frequents-content p {
      font-size: 13px;
      color: var(--text-secondary);
      line-height: 1.5;
    }

    /* ============================================
       F. EXPLORE & DISCOVER DEALS
       ============================================ */
    .explore-section {
      margin: 20px 16px 0;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .explore-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-primary);
    }

    .explore-emoji {
      font-size: 16px;
      line-height: 1;
    }

    /* ============================================
       G. DEAL BANNER
       ============================================ */
    .banner-wrapper {
      margin: 12px 16px 0;
      border-radius: var(--radius-card);
      overflow: hidden;
      position: relative;
      box-shadow: var(--shadow-sm);
      background: #1A1A1A;
      min-height: 140px;
      aspect-ratio: 16 / 7;
    }

    .banner-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      position: absolute;
      top: 0;
      left: 0;
    }

    .banner-fallback {
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #0D1B2A 0%, #1B3A4B 50%, #0D1B2A 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #FFFFFF;
      font-size: 14px;
      font-weight: 600;
      padding: 20px;
      text-align: center;
      position: relative;
      z-index: 1;
    }

    /* ============================================
       H. SCAN TO PAY FLOATING BUTTON
       ============================================ */
    .scan-pay-btn {
      position: absolute;
      bottom: 18px;
      right: 18px;
      background: #FFFFFF;
      border: none;
      border-radius: 14px;
      padding: 12px 16px 12px 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
      cursor: pointer;
      z-index: 10;
      font-family: var(--font-family);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .scan-pay-btn:active {
      transform: scale(0.97);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
    }

    .scan-pay-btn .qr-icon {
      width: 28px;
      height: 28px;
      flex-shrink: 0;
    }

    .scan-pay-btn .scan-text {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-primary);
      white-space: nowrap;
    }

    /* ============================================
       I. FLOATING ASSISTANT BUTTON
       ============================================ */
    .assistant-btn {
      position: absolute;
      bottom: 70px;
      right: 16px;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: #FFFFFF;
      border: 2px solid #FFFFFF;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
      cursor: pointer;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      transition: transform 0.15s ease;
    }

    .assistant-btn:active {
      transform: scale(0.95);
    }

    .assistant-btn img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
    }

    .assistant-placeholder {
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #E8F0FE, #D2E3FC);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      border-radius: 50%;
    }

    /* ============================================
       UTILITY / MISC
       ============================================ */
    .hidden {
      display: none !important;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      border: 0;
    }

    /* Responsive tweaks */
    @media (max-width: 360px) {
      .quick-action-item .qa-label {
        font-size: 9px;
      }
      .qa-icon {
        width: 44px;
        height: 44px;
      }
      .qa-icon svg {
        width: 20px;
        height: 20px;
      }
      .balance-card {
        flex: 0 0 85%;
        padding: 14px 14px 16px;
      }
      .balance-amount {
        font-size: 26px;
      }
      .header {
        padding: 12px 14px 14px;
      }
      .avatar {
        width: 42px;
        height: 42px;
        font-size: 15px;
      }
      .greeting-name {
        font-size: 17px;
      }
      .icon-btn {
        width: 38px;
        height: 38px;
      }
      .icon-btn svg {
        width: 18px;
        height: 18px;
      }
      .quick-actions-card {
        padding: 16px 12px 18px;
        margin: 14px 14px 0;
      }
      .frequents-card {
        padding: 16px 16px;
        margin: 14px 14px 0;
      }
      .explore-section {
        margin: 20px 14px 0;
      }
      .banner-wrapper {
        margin: 12px 14px 0;
      }
      .scan-pay-btn {
        padding: 12px 16px 12px 12px;
        bottom: 16px;
        right: 16px;
      }
      .scan-pay-btn .scan-text {
        font-size: 15px;
      }
      .scan-pay-btn .qr-icon {
        width: 28px;
        height: 28px;
      }
      .assistant-btn {
        width: 56px;
        height: 56px;
        bottom: 70px;
        right: 14px;
      }
    }
  </style>
</head>
<body>

<div class="app-container" id="app">

  <!-- ============================================
       A. TOP HEADER
       ============================================ -->
  <header class="header">
    <div class="header-left">
      <div class="avatar-wrapper">
        <div class="avatar">DY</div>
        <div class="avatar-badge">
          <svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
        </div>
      </div>
      <div class="greeting">
        <span class="greeting-top">Good afternoon,</span>
        <span class="greeting-name">Dickson <span style="font-size:18px;">👋</span></span>
      </div>
    </div>
    <div class="header-right">
      <button class="icon-btn" aria-label="Notifications">
        <svg viewBox="0 0 24 24" fill="none" stroke="#252525" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
          <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
        </svg>
        <span class="notification-dot"></span>
      </button>
      <button class="icon-btn" aria-label="Search">
        <svg viewBox="0 0 24 24" fill="none" stroke="#35A853" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/>
          <line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- ============================================
       B. BALANCE CARD CAROUSEL
       ============================================ -->
  <section class="carousel-section">
    <div class="carousel-track" id="carouselTrack">

      <!-- First Balance Card -->
      <div class="balance-card" id="balanceCard">
        <div class="balance-label">M-PESA Balance</div>
        <div class="balance-amount-row">

<!-- ============================================
     JAVASCRIPT
     ============================================ -->
<script>
  (function() {
    'use strict';

    // ------------------------------------------
    // State
    // ------------------------------------------
    let balanceVisible = true;
    let isLoading = false;

    // DOM References
    const balanceAmount = document.getElementById('balanceAmount');
    const fulizaText = document.getElementById('fulizaText');
    const hiddenBalancePlaceholder = document.getElementById('hiddenBalancePlaceholder');
    const hiddenFulizaPlaceholder = document.getElementById('hiddenFulizaPlaceholder');
    const skeletonAmount = document.getElementById('skeletonAmount');
    const skeletonFuliza = document.getElementById('skeletonFuliza');
    const eyeBtn = document.getElementById('eyeBtn');
    const eyeIcon = document.getElementById('eyeIcon');

    // ------------------------------------------
    // 1. Balance Visibility Toggle
    // ------------------------------------------
    function toggleBalanceVisibility() {
      if (isLoading) return; // Don't toggle while loading

      balanceVisible = !balanceVisible;

      if (balanceVisible) {
        // Show actual balance
        balanceAmount.classList.remove('hidden');
        hiddenBalancePlaceholder.classList.remove('visible');
        
        fulizaText.classList.remove('hidden');
        hiddenFulizaPlaceholder.classList.remove('visible');
        
        // Eye open icon
        eyeIcon.innerHTML = `
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
          <circle cx="12" cy="12" r="3"/>
        `;
        eyeIcon.setAttribute('stroke', '#777777');
      } else {
        // Hide balance: show soft gray rounded placeholders
        balanceAmount.classList.add('hidden');
        hiddenBalancePlaceholder.classList.add('visible');
        
        fulizaText.classList.add('hidden');
        hiddenFulizaPlaceholder.classList.add('visible');
        
        // Eye closed icon
        eyeIcon.innerHTML = `
          <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
          <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
          <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/>
          <line x1="1" y1="1" x2="23" y2="23"/>
        `;
        eyeIcon.setAttribute('stroke', '#777777');
      }
    }

    // ------------------------------------------
    // 2. Loading State Toggle
    // ------------------------------------------
    function setLoadingState(loading) {
      isLoading = loading;

      if (loading) {
        // Hide all real and hidden content
        balanceAmount.classList.add('hidden');
        fulizaText.classList.add('hidden');
        hiddenBalancePlaceholder.classList.remove('visible');
        hiddenFulizaPlaceholder.classList.remove('visible');
        
        // Show skeleton loaders
        skeletonAmount.classList.remove('skeleton-hidden');
        skeletonFuliza.classList.remove('skeleton-hidden');
        
        // Keep eye visible (per screenshot)
      } else {
        // Hide skeleton loaders
        skeletonAmount.classList.add('skeleton-hidden');
        skeletonFuliza.classList.add('skeleton-hidden');
        
        // Restore correct state based on balanceVisible
        if (balanceVisible) {
          balanceAmount.classList.remove('hidden');
          hiddenBalancePlaceholder.classList.remove('visible');
          
          fulizaText.classList.remove('hidden');
          hiddenFulizaPlaceholder.classList.remove('visible');
        } else {
          balanceAmount.classList.add('hidden');
          hiddenBalancePlaceholder.classList.add('visible');
          
          fulizaText.classList.add('hidden');
          hiddenFulizaPlaceholder.classList.add('visible');
        }
      }
    }

    // Expose to window for manual testing
    window.setLoadingState = setLoadingState;
    window.toggleBalanceVisibility = toggleBalanceVisibility;

    // ------------------------------------------
    // 3. Balance Carousel
    // ------------------------------------------
    const track = document.getElementById('carouselTrack');
    track.addEventListener('scroll', function() {
      const indicators = document.querySelectorAll('.indicator');
      const cardWidth = track.querySelector('.balance-card').offsetWidth + 12; // gap
      const index = Math.round(track.scrollLeft / cardWidth);
      indicators.forEach((ind, i) => {
        if (i === index) {
          ind.classList.add('active');
          ind.classList.remove('inactive');
        } else {
          ind.classList.remove('active');
          ind.classList.add('inactive');
        }
      });
    }, { passive: true });

    // ------------------------------------------
    // 4. Quick Action Buttons
    // ------------------------------------------
    window.handleQuickAction = function(actionName) {
      console.log('Quick Action:', actionName);
    };

    // ------------------------------------------
    // 5. Frequents Expand/Collapse
    // ------------------------------------------
    const frequentsToggle = document.getElementById('frequentsToggle');
    const frequentsContent = document.getElementById('frequentsContent');
    const frequentsChevron = document.getElementById('frequentsChevron');

    frequentsToggle.addEventListener('click', function() {
      const isOpen = frequentsContent.classList.contains('open');
      if (isOpen) {
        frequentsContent.classList.remove('open');
        frequentsChevron.classList.remove('open');
      } else {
        frequentsContent.classList.add('open');
        frequentsChevron.classList.add('open');
      }
    });

    // ------------------------------------------
    // 6. Scan to Pay
    // ------------------------------------------
    window.handleScanPay = function() {
      console.log('Scan to pay clicked');
    };

    // ------------------------------------------
    // 7. Assistant Button
    // ------------------------------------------
    window.handleAssistant = function() {
      console.log('Assistant clicked');
    };

    // ------------------------------------------
    // 8. Eye button event
    // ------------------------------------------
    eyeBtn.addEventListener('click', toggleBalanceVisibility);

    // ------------------------------------------
    // 9. Initial state
    // ------------------------------------------
    setLoadingState(false);

  })();
</script>
